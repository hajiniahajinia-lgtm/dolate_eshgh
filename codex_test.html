<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>آزمایش اتصال کدکس</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7f6;
      color: #244b3b;
    }
    .greeting {
      position: fixed;
      top: 16px;
      left: 16px;
      font-size: 32px;
      font-weight: bold;
      padding: 12px 18px;
      background: white;
      border: 2px solid #244b3b;
      border-radius: 8px;
    }
    main {
      max-width: 680px;
      margin: 100px auto 0;
      padding: 24px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="greeting">سلام!</div>
  <main>
    <h1>صفحهٔ آزمایشی کدکس</h1>
    <p>این فایل فقط برای آزمایش دسترسی نوشتن به مخزن گیت‌هاب «دولت عشق» ساخته شده است.</p>
    <p>فایل‌های اصلی پروژه تغییری نکرده‌اند.</p>
  </main>
</body>
</html>
