name: Browserless runner unit tests

on:
  pull_request:
    paths:
      - "tools/ai-bridge/**"
  push:
    branches:
      - "feature/test-account-runner-main"
    paths:
      - "tools/ai-bridge/**"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline tests
        run: python -m unittest discover -s tools/ai-bridge -p "test_*.py" -v
