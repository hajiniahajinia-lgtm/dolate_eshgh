name: Browserless runner unit tests

on:
  pull_request:
    paths:
      - "tools/ai-bridge/**"
      - "*.php"
      - "maintenance/**"
  push:
    branches:
      - "feature/test-account-runner-main"
    paths:
      - "tools/ai-bridge/**"
      - "*.php"
      - "maintenance/**"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      - name: Check PHP syntax
        run: |
          php -l stats.php
          php -l community_stats.php
          php -l profile.php
          php -l community.php
          php -l archived_topics.php
          php -l votes.php
          php -l maintenance/run_due_tasks.php
      - name: Run offline tests
        run: python -m unittest discover -s tools/ai-bridge -p "test_*.py" -v
