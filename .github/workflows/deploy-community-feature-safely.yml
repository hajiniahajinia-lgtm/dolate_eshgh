name: Safely deploy community similarity feature

on:
  workflow_dispatch:

jobs:
  upload-selected-files:
    name: Upload only the three reviewed PHP files
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Upload selected files without deleting anything
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -eu
          for file in profile.php create_community.php community_stats.php; do
            echo "Uploading $file"
            curl --fail --show-error --silent --ftp-create-dirs \
              --user "$FTP_USERNAME:$FTP_PASSWORD" \
              --upload-file "$file" \
              "ftp://$FTP_SERVER${FTP_SERVER_DIR%/}/$file"
          done
