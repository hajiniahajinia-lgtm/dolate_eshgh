          php -l tests/community_law_conformity_transaction_contract_test.php
          php -l community_law_conformity_action.php
          php -l community_law_conformity_cases.php
          php -l community_law_amendment_helpers.php
          php -l community_law_amendments.php
          php -l tests/community_law_change_control_integration_test.php
          php -l tests/migration_order_test.php
          php -l tests/community_law_amendment_vote_contract_test.php
          php -l tests/community_law_amendment_notice_contract_test.php
          php -l tests/community_law_amendment_membership_lock_contract_test.php
