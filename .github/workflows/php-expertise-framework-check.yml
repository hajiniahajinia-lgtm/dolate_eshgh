  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Check PHP syntax
        run: |
          php -l add_topic.php
          php -l community_laws.php
          php -l tests/topic_intent_classification_contract_test.php
          php -l tests/topic_intent_classification_integration_test.php
          php -l tests/community_law_origin_integration_test.php
          php -l community_decision_ledger.php
