      - 'migrations/20261108_community_law_change_control.sql'
      - 'migrations/20261108_community_law_change_review.sql'
      - 'migrations/20261108_community_law_change_voting.sql'
      - 'community_law_change_helpers.php'
      - 'tests/community_law_change_control_integration_test.php'
      - 'community_law_helpers.php'
      - 'set_community_parent.php'
      - 'profile.php'
      - 'create_community.php'
      - 'leave_community.php'
      - 'join_community.php'
      - 'topic_expertise_profile.php'
      - 'topic_expertise_profile_action.php'
      - 'community_member_removal_helpers.php'
      - 'request_member_removal.php'
      - 'vote_member_removal.php'
      - 'tests/community_law_hierarchy_helpers_test.php'
      - 'tests/community_charter_amendments_test.php'
      - 'tests/community_charter_amendments_integration_test.php'
      - 'community_decision_ledger.php'
      - 'migrations/20261108_community_decision_ledger.sql'
      - 'migrations/20261108_community_decision_ledger_backfill.sql'
      - 'migrations/20261108_community_decision_knowledge_link.sql'
      - 'migrations/20261108_community_law_decision_origin.sql'
      - 'migrations/20261108_community_law_change_control.sql'
      - 'community_law_change_helpers.php'
      - 'tests/community_law_change_control_integration_test.php'
      - 'tests/community_decision_ledger_integration_test.php'
      - 'tests/community_decision_ledger_backfill_integration_test.php'
      - 'tests/community_decision_knowledge_separation_integration_test.php'
      - 'tests/community_decision_knowledge_link_integration_test.php'
      - 'tests/community_law_implementation_integration_test.php'
      - '.github/workflows/php-expertise-framework-check.yml'
  pull_request:
    paths:
      - 'migrations/20261108_community_law_change_control.sql'
      - 'migrations/20261108_community_law_change_review.sql'
      - 'migrations/20261108_community_law_change_voting.sql'
      - 'community_law_change_helpers.php'
      - 'tests/community_law_change_control_integration_test.php'
      - 'expertise.php'
      - 'expertise_action.php'
      - 'votes.php'
      - 'community_laws.php'
      - 'archived_topics.php'
      - 'knowledge_library.php'
      - 'community_charter_amendment_action.php'
      - 'community_charter_amendments.php'
      - 'migrations/20261107_community_charter_foundation.sql'
      - 'migrations/20261107_community_charter_amendments.sql'
      - 'migrations/20261108_community_charter_amendment_appeal_assignments.sql'
      - 'community.php'
      - 'collective_knowledge_finalizer.php'
      - 'community_decision_ledger.php'
      - 'migrations/20261106_community_law_objections_schema_repair.sql'
      - 'migrations/20261107_community_law_framework.sql'
      - 'migrations/20261108_community_decision_ledger.sql'
      - 'migrations/20261108_community_decision_ledger_backfill.sql'
      - 'migrations/20261108_community_decision_knowledge_link.sql'
      - 'migrations/20261108_community_law_decision_origin.sql'
      - 'community_law_helpers.php'
      - 'set_community_parent.php'
      - 'request_member_removal.php'
      - 'community_member_removal_helpers.php'
      - 'leave_community.php'
      - 'join_community.php'
      - 'create_community.php'
      - 'profile.php'
      - 'topic_expertise_profile.php'
      - 'topic_expertise_profile_action.php'
      - 'vote_member_removal.php'
      - 'tests/community_law_hierarchy_helpers_test.php'
      - 'tests/community_charter_amendments_test.php'
      - 'tests/community_charter_amendments_integration_test.php'
      - 'tests/community_law_implementation_integration_test.php'
      - 'tests/community_decision_ledger_integration_test.php'
      - 'tests/community_decision_ledger_backfill_integration_test.php'
      - 'tests/community_decision_knowledge_separation_integration_test.php'
      - '.github/workflows/php-expertise-framework-check.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Check PHP syntax
        run: |
          php -l expertise.php
          php -l expertise_action.php
          php -l votes.php
          php -l community_laws.php
          php -l archived_topics.php
          php -l knowledge_library.php
          php -l community.php
          php -l collective_knowledge_finalizer.php
          php -l community_charter_amendment_action.php
          php -l community_charter_amendments.php
          php -l community_law_helpers.php
          php -l community_law_change_helpers.php
          php -l tests/community_law_change_control_integration_test.php
          php -l set_community_parent.php
          php -l profile.php
          php -l create_community.php
          php -l leave_community.php
          php -l request_member_removal.php
          php -l vote_member_removal.php
          php -l community_member_removal_helpers.php
          php -l join_community.php
          php -l topic_expertise_profile.php
          php -l topic_expertise_profile_action.php
          php -l tests/community_law_hierarchy_helpers_test.php
          php -l tests/community_charter_amendments_test.php
          php -l tests/community_charter_amendments_integration_test.php
          php -l tests/community_law_implementation_integration_test.php
          php -l community_decision_ledger.php
          php -l tests/community_law_decision_origin_migration_test.php
          php -l tests/community_decision_knowledge_link_integration_test.php
          php -l tests/community_decision_ledger_integration_test.php
          php -l tests/community_decision_ledger_backfill_integration_test.php
          php -l tests/community_decision_knowledge_separation_integration_test.php
      - name: Run community law hierarchy and charter amendment tests
        run: |
          php tests/community_law_hierarchy_helpers_test.php
          php tests/community_charter_amendments_test.php

  charter-mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dolate_charter_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP with MySQL support
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
      - name: Run isolated MySQL integration tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: dolate_charter_ci
          DB_USER: root
          DB_PASSWORD: root
        run: |
          php tests/community_charter_amendments_integration_test.php
          php tests/community_law_implementation_integration_test.php
          php tests/community_law_change_control_integration_test.php
          php tests/community_law_decision_origin_migration_test.php
          php tests/community_decision_knowledge_link_integration_test.php
          php tests/community_decision_ledger_integration_test.php
          php tests/community_decision_ledger_backfill_integration_test.php
          php tests/community_decision_knowledge_separation_integration_test.php
