name: PHP syntax check - expertise and community laws

on:
  push:
    branches:
      - feature/community-law-framework
    paths:
      - 'expertise.php'
      - 'expertise_action.php'
      - 'votes.php'
      - 'community_laws.php'
      - 'community_charter_amendment_action.php'
      - 'community_charter_amendments.php'
      - 'migrations/20261108_community_charter_amendment_appeal_assignments.sql'
      - 'community_law_helpers.php'
      - 'set_community_parent.php'
      - 'profile.php'
      - 'create_community.php'
      - 'leave_community.php'
      - 'join_community.php'
      - 'topic_expertise_profile.php'
      - 'topic_expertise_profile_action.php'
      - 'community_member_removal_helpers.php'
      - 'request_member_removal.php'
      - 'vote_member_removal.php'
      - 'tests/community_law_hierarchy_helpers_test.php'
      - 'migrations/20261107_community_charter_amendments.sql'
      - 'tests/community_charter_amendments_test.php'
      - '.github/workflows/php-expertise-framework-check.yml'
  pull_request:
    paths:
      - 'expertise.php'
      - 'expertise_action.php'
      - 'votes.php'
      - 'community_laws.php'
      - 'community_law_helpers.php'
      - 'set_community_parent.php'
      - 'request_member_removal.php'
      - 'community_member_removal_helpers.php'
      - 'leave_community.php'
      - 'join_community.php'
      - 'create_community.php'
      - 'profile.php'
      - 'topic_expertise_profile.php'
      - 'topic_expertise_profile_action.php'
      - 'vote_member_removal.php'
      - 'tests/community_law_hierarchy_helpers_test.php'
      - 'migrations/20261107_community_charter_amendments.sql'
      - 'tests/community_charter_amendments_test.php'
      - '.github/workflows/php-expertise-framework-check.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Check PHP syntax
        run: |
          php -l expertise.php
          php -l expertise_action.php
          php -l votes.php
          php -l community_laws.php
          php -l community_charter_amendment_action.php
          php -l community_charter_amendments.php
          php -l community_law_helpers.php
          php -l set_community_parent.php
          php -l profile.php
          php -l create_community.php
          php -l leave_community.php
          php -l request_member_removal.php
          php -l vote_member_removal.php
          php -l community_member_removal_helpers.php
          php -l join_community.php
          php -l topic_expertise_profile.php
          php -l topic_expertise_profile_action.php
          php -l tests/community_law_hierarchy_helpers_test.php
          php -l tests/community_charter_amendments_test.php
      - name: Run community law hierarchy and charter amendment tests
        run: |
          php tests/community_law_hierarchy_helpers_test.php
          php tests/community_charter_amendments_test.php
