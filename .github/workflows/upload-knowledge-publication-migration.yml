name: Upload knowledge publication migration

on:
  push:
    branches:
      - main
    paths:
      - 'migrations/20261106_knowledge_publication_community_vote.sql'
  workflow_dispatch:

jobs:
  upload-migration:
    name: Upload only the knowledge publication migration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload exactly one migration file (no deletion)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -eu
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$FTP_SERVER_DIR"
          curl --fail --show-error --silent --ftp-create-dirs \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file "migrations/20261106_knowledge_publication_community_vote.sql" \
            "ftp://${FTP_SERVER}${FTP_SERVER_DIR%/}/migrations/20261106_knowledge_publication_community_vote.sql"
