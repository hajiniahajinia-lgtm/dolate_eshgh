name: Deploy to InfinityFree

# Uploads dated SQL migration files; the hosting-side executor applies them on the next normal page request.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Upload website files and stage database migrations
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Deploy website files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.github/**
            **/README*
            **/db.php
            **/migration_config.php
            **/dolate_eshgh1.sql
            **/*backup*.php
            **/full_backup.php
            **/.env

      - name: Verify migration files are staged for host-side execution
        shell: bash
        run: |
          set -euo pipefail
          if ! find migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]_*.sql' -print -quit | grep -q .; then
            echo "::error::No dated SQL migration files were found."
            exit 1
          fi
          echo "Dated SQL migrations are included in the FTP deployment."
          echo "The hosting-side executor applies pending migrations when a normal website page loads."
