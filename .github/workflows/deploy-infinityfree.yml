name: Test single-file transfer to InfinityFree

on:
  workflow_dispatch:

jobs:
  upload-test-file:
    name: Upload only the test file
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload one test file only
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          set -eu
          curl --fail --show-error --silent --ftp-create-dirs \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --upload-file "deployment-test/transfer-test.txt" \
            "ftp://${FTP_SERVER}${FTP_SERVER_DIR%/}/transfer-test.txt"
